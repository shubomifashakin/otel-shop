services:
  auth-postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce-auth-db
    volumes:
      - auth_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  products-postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce-products-db
    volumes:
      - products_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.4
    mem_limit: 512m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    mem_limit: 512m
    environment:
      PORT: 3001
      SERVICE_NAME: auth
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:postgres@auth-postgres:5432/ecommerce-auth-db
      JWT_ISSUER: http://auth:3001
      JWT_AUDIENCE: shop-api
      ACCESS_TOKEN_TTL_SECONDS: 900
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?generate one, see README}
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    init: true
    restart: unless-stopped

  products:
    build:
      context: .
      dockerfile: services/products/Dockerfile
    mem_limit: 512m
    environment:
      PORT: 3003
      SERVICE_NAME: products
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:postgres@products-postgres:5432/ecommerce-products-db
    depends_on:
      products-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    init: true
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    mem_limit: 512m
    ports:
      - 3000:3000
    environment:
      PORT: 3000
      SERVICE_NAME: gateway
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth:3001
      CART_SERVICE_URL: http://cart:3002
      PRODUCTS_SERVICE_URL: http://products:3003
      PAYMENT_SERVICE_URL: http://payment:3004
      AUTH_JWKS_URL: http://auth:3001/.well-known/jwks.json
      JWT_ISSUER: http://auth:3001
      JWT_AUDIENCE: shop-api
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
      products:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 20s
    init: true
    restart: unless-stopped

volumes:
  redis_data:
  auth_postgres_data:
  products_postgres_data:
