apiVersion: 1
groups:
  - orgId: 1
    name: http-health
    folder: http
    interval: 1m
    rules:
      - uid: cg46bmlzdhf5sc
        title: High 5xx Error Ratio
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |-
                (
                  sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
                  /
                  sum by (job) (rate(http_server_request_duration_seconds_count[5m]))
                )
                and
                sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0.25
              hide: false
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.25
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        panelId: 2
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "{{ $labels.job }}: more than 25% of requests are failing with 5xx"
        labels:
          severity: HIGH
        isPaused: false

      - uid: fg46d1wqph43kd
        title: Too Many Unauthorized Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum by (job) (rate(http_server_request_duration_seconds_count{http_route="/login",http_response_status_code="401"}[5m]))
              hide: false
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "{{ $labels.job }}: failed logins above 3/s (possible credential stuffing)"
        labels:
          severity: HIGH
        isPaused: false

      - uid: fg46dnqhb53i8a
        title: Too Many Checkout Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |-
                (
                  sum by (job) (rate(payments_checkouts_total{outcome!="initiated"}[5m]))
                  /
                  sum by (job) (rate(payments_checkouts_total[5m]))
                )
                and
                sum by (job) (rate(payments_checkouts_total[5m])) > 0.1
              hide: false
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.25
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 3m
        annotations:
          summary: "{{ $labels.job }}: more than 25% of checkout attempts are failing"
        labels:
          severity: HIGH
        isPaused: false

      - uid: hg46p99latency01
        title: High p99 Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |-
                histogram_quantile(
                  0.99,
                  sum by (le, job) (rate(http_server_request_duration_seconds_bucket[5m]))
                )
                and
                sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0.25
              hide: false
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "{{ $labels.job }}: p99 latency above 3s for 5 minutes"
        labels:
          severity: WARNING
        isPaused: false
