apiVersion: 1

# you can configure this to whatever contact point you wan tto use
# this is meant to serve as an example
contactPoints:
  - orgId: 1
    name: Payments On Call
    receivers:
      - uid: payments-discord
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          use_discord_username: true
          use_embed_description: false
        disableResolveMessage: false

